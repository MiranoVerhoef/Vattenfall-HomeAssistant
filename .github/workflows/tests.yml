name: Tests

on: [pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            homeassistant: '2024.6.0'
          - python: '3.14'
            homeassistant: '2026.11.0'
    name: Home Assistant ${{ matrix.homeassistant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        run: |
          if [ "$HA_VERSION" = "2024.6.0" ]; then
            # The ACME dependency in this release uses the josepy 1.x API.
            python -m pip install "homeassistant==$HA_VERSION" "josepy<2" \
              --constraint "https://raw.githubusercontent.com/home-assistant/core/$HA_VERSION/homeassistant/package_constraints.txt"
          else
            python -m pip install "homeassistant==$HA_VERSION"
          fi
      - run: python -m unittest discover -s tests -v

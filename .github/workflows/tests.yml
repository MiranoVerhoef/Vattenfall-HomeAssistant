name: Tests

on: [pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            homeassistant: '2024.6.0'
          - python: '3.14'
            homeassistant: '2026.11.0'
    name: Home Assistant ${{ matrix.homeassistant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "homeassistant==${{ matrix.homeassistant }}"
      - run: python -m unittest discover -s tests -v

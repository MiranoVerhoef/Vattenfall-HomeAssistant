name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/vattenfall_dynamic_prices/manifest.json

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish version from manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          manifest=custom_components/vattenfall_dynamic_prices/manifest.json
          previous=$(git show "$PREVIOUS_SHA:$manifest" | jq -er '.version')
          version=$(jq -er '.version' "$manifest")

          if [[ "$version" == "$previous" ]]; then
            echo "Manifest version is unchanged."
            exit 0
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable version in major.minor.patch format."
            exit 1
          fi

          if [[ "$(printf '%s\n' "$previous" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "::error::Manifest version must increase."
            exit 1
          fi

          if tag_commit=$(git rev-parse --verify --quiet "refs/tags/$version^{commit}"); then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $version already points to a different commit."
              exit 1
            fi
          fi

          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $version already exists."
            exit 0
          fi

          notes=$(mktemp)
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].body // empty' > "$notes"

          gh release create "$version" --repo "$GITHUB_REPOSITORY" --title "$version" \
            --target "$GITHUB_SHA" --notes-file "$notes" --generate-notes
